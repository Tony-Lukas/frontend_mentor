<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Component</title>
    <link rel="stylesheet" href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css" class="href">
</head>
<body>
    <div class="flex justify-center items-center h-screen bg-red-200">
        <div class="bg-white p-6 rounded-xl max-w-xs text-center">
            <img src="../images/image-qr-code.png" 
            alt="QR_Code" class="rounded-lg">
            
            <h1 class="font-roboto font-bold my-4 text-xl text-balance">Improve your front-end skills by building projects</h1>
            <p class="text-balance">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
            
        </div>
    </div>
    
</body>
</html>
